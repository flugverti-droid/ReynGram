name: Build ReynGram

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Build APK
        run: ./gradlew tasks --all --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReynGram-debug
          path: "**/build/outputs/apk/**/*.apk"
